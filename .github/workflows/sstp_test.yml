
name: SSTP Fetcher Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sstp:
    name: Test SSTP Data Collection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install SSTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y sstp-client ppp iproute2 curl

      - name: Fetch SSTP servers
        run: python src/sstp_fetcher.py

      - name: Prepare PPP authentication
        run: |
          echo "vpn * vpn *" | sudo tee /etc/ppp/chap-secrets
          echo "vpn * vpn *" | sudo tee /etc/ppp/pap-secrets
          sudo chmod 600 /etc/ppp/chap-secrets /etc/ppp/pap-secrets

      - name: Test SSTP servers
        continue-on-error: true
        run: python src/sstp_tester.py

      - name: Upload all SSTP servers
        uses: actions/upload-artifact@v4
        with:
          name: sstp-servers-test
          path: output/sstp_servers.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload selected healthy SSTP servers
        uses: actions/upload-artifact@v4
        with:
          name: selected-sstp-servers-test
          path: output/selected_sstp_servers.json
          if-no-files-found: warn
          retention-days: 3
