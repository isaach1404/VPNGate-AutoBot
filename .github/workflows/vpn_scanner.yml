
name: VPN Gate Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

jobs:
  scan:
    name: Fetch VPN Gate Servers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Run VPN Gate API scanner
        run: python src/vpngate_api.py
