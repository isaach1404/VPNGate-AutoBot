
name: VPN Gate Scanner

on:
  workflow_dispatch:
  # GitHub runs a scheduled workflow at only a fraction of its cron
  # slots -- measured on this repo at ~9%, at random minutes and never
  # on the requested one -- so a '7 * * * *' cron produced a run every
  # 4-11 hours. The cron therefore asks every 5 minutes (the fastest
  # GitHub allows) and the gate job decides whether the scan is due,
  # which turns the schedule into a lower bound instead of a lottery.
  # Most fires stop at the gate after a few seconds.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: vpn-gate-scanner
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether a scan is due
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      due: ${{ steps.check.outputs.due }}

    steps:
      - name: Check whether a scan is due
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import json
          import os
          import sys
          import urllib.request

          INTERVAL_MINUTES = 50

          # A scan runs for minutes; a gated-out fire stops within
          # seconds. Duration is the cheapest reliable discriminator:
          # it needs one API call, where matching on step names would
          # need one per run and could stall the gate on rate limits.
          SCAN_MINUTES = 3

          def note(message):
              # stdout is redirected into $GITHUB_OUTPUT, so anything
              # that is not a key=value pair has to go to stderr.
              print(message, file=sys.stderr)

          def fetch_runs():
              path = "/actions/workflows/scan.yml/runs?per_page=50"
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)["workflow_runs"]

          def minutes_between(earlier, later):
              start = datetime.datetime.fromisoformat(
                  earlier.replace("Z", "+00:00")
              )
              end = datetime.datetime.fromisoformat(
                  later.replace("Z", "+00:00")
              )
              return (end - start).total_seconds() / 60

          def last_scan_minutes_ago():
              """Age of the most recent run that actually scanned."""

              current = int(os.environ["RUN_ID"])
              now = datetime.datetime.now(datetime.timezone.utc).isoformat()

              for run in fetch_runs():
                  if run["id"] == current or run["status"] != "completed":
                      continue
                  if run["conclusion"] != "success":
                      continue
                  if minutes_between(
                      run["run_started_at"], run["updated_at"]
                  ) < SCAN_MINUTES:
                      continue

                  return minutes_between(run["run_started_at"], now)

              return None

          def decide():
              if os.environ["EVENT_NAME"] != "schedule":
                  note("Manual run; scanning.")
                  return True

              try:
                  elapsed = last_scan_minutes_ago()
              except Exception as error:
                  # Better to scan twice than never: the gate exists to
                  # stop floods, not to become a new way to miss a run.
                  note(f"Could not read run history ({error}); scanning.")
                  return True

              if elapsed is None:
                  note("No earlier scan found; scanning.")
                  return True

              note(f"Last scan started {elapsed:.0f} min ago.")

              return elapsed >= INTERVAL_MINUTES

          print(f"due={'true' if decide() else 'false'}")
          PY

  scan:
    name: Fetch VPN Gate Servers
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install VPN clients and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openvpn \
            sstp-client \
            ppp \
            iproute2 \
            curl

          echo "OpenVPN version:"
          openvpn --version

          echo "SSTP client version:"
          sstpc --version

          echo "PPP version:"
          sudo pppd --version

      - name: Check TUN device availability
        run: |
          if [ -c /dev/net/tun ]; then
            echo "TUN device exists."
            ls -l /dev/net/tun
          else
            echo "TUN device is not available."
            exit 1
          fi

      - name: Check network interface permissions
        run: |
          echo "Checking network administration capability..."

          if sudo ip tuntap add dev vpn_test mode tun; then
            echo "TUN interface creation successful."
            ip link show vpn_test
            sudo ip link delete vpn_test
            echo "TUN interface cleanup successful."
          else
            echo "TUN interface creation failed."
            exit 1
          fi

      - name: Verify SSTP client installation
        run: |
          echo "Checking SSTP client..."
          command -v sstpc
          sstpc --help || true

          echo "Checking PPP daemon..."
          command -v pppd

          echo "SSTP client tools are available."
          echo "SSTP package information:"
          apt-cache policy sstp-client

      # continue-on-error keeps one failing half of the scan from
      # blocking delivery of whatever the other half found.
      - name: Run VPN Gate API scanner
        continue-on-error: true
        env:
          MAX_SERVERS_TO_TEST: "40"
          MAX_TEST_SECONDS: "600"
        run: python src/vpngate_api.py

      - name: Fetch SSTP servers
        continue-on-error: true
        run: python src/sstp_fetcher.py

      - name: Prepare PPP authentication
        run: |
          echo "Preparing PPP authentication files..."

          echo "vpn * vpn *" | sudo tee /etc/ppp/chap-secrets
          echo "vpn * vpn *" | sudo tee /etc/ppp/pap-secrets

          sudo chmod 600 /etc/ppp/chap-secrets
          sudo chmod 600 /etc/ppp/pap-secrets

          echo "PPP authentication files prepared."

      - name: Test SSTP servers
        continue-on-error: true
        run: python src/sstp_tester.py

      - name: Collect run summary
        if: always()
        run: |
          echo "========== OUTPUT FILES =========="
          ls -la output/ 2>&1 || true

          for file in output/selected_servers.json output/selected_sstp_servers.json; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              python -c "import json,sys; print('entries:', len(json.load(open('$file'))))" || true
            fi
          done

      - name: Send OpenVPN and SSTP servers to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/telegram_sender.py

      - name: Send OpenVPN and SSTP servers to Rubika
        continue-on-error: true
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: python src/rubika_sender.py

      - name: Package OpenVPN files
        if: always()
        run: |
          if [ -d output/openvpn ] && [ "$(find output/openvpn -name '*.ovpn' -type f | wc -l)" -gt 0 ]; then
            (cd output && zip -r ../vpngate-openvpn-configs.zip openvpn)
          else
            echo "No OpenVPN configuration files were generated."
          fi

      - name: Upload OpenVPN package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-openvpn-configs
          path: vpngate-openvpn-configs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload selected OpenVPN servers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-selected-servers
          path: output/selected_servers.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload selected SSTP servers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-selected-sstp-servers
          path: output/selected_sstp_servers.json
          if-no-files-found: warn
          retention-days: 7
