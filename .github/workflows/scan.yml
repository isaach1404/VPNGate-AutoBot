
name: VPN Gate Scanner

on:
  workflow_dispatch:
  # GitHub fires this repo's schedule only ~4 times a day no matter
  # what the cron says ('7,37', '7' and '*/5' all behaved alike, at
  # random minutes, after ~85 hours of measurement). The scheduler
  # cannot be relied on for an hourly cadence, so a fire is treated as
  # a heartbeat: each run keeps scanning once an hour for about five
  # hours before ending, and the next fire restarts it. Public repos
  # get unmetered runner minutes, so the idle time between scans is
  # free; `concurrency` below means a fire that lands mid-run simply
  # waits and starts the next stretch instead of overlapping.
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: vpn-gate-scanner
  cancel-in-progress: false

jobs:
  scan:
    name: Fetch VPN Gate Servers
    runs-on: ubuntu-latest
    # GitHub kills a job at 6 hours; stop short of that so the loop
    # ends cleanly and the next fire picks up without a gap.
    timeout-minutes: 355

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install VPN clients and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openvpn \
            sstp-client \
            ppp \
            iproute2 \
            curl

          echo "OpenVPN version:"
          openvpn --version

          echo "SSTP client version:"
          sstpc --version

          echo "PPP version:"
          sudo pppd --version

      - name: Check TUN device availability
        run: |
          if [ -c /dev/net/tun ]; then
            echo "TUN device exists."
            ls -l /dev/net/tun
          else
            echo "TUN device is not available."
            exit 1
          fi

      - name: Check network interface permissions
        run: |
          echo "Checking network administration capability..."

          if sudo ip tuntap add dev vpn_test mode tun; then
            echo "TUN interface creation successful."
            ip link show vpn_test
            sudo ip link delete vpn_test
            echo "TUN interface cleanup successful."
          else
            echo "TUN interface creation failed."
            exit 1
          fi

      - name: Verify SSTP client installation
        run: |
          echo "Checking SSTP client..."
          command -v sstpc
          sstpc --help || true

          echo "Checking PPP daemon..."
          command -v pppd

          echo "SSTP client tools are available."
          echo "SSTP package information:"
          apt-cache policy sstp-client

      # One step so the scan can repeat. It stops of its own accord,
      # well inside the job timeout, and the next scheduled fire starts
      # a fresh stretch. Every stage keeps its own continue-on-error:
      # a failure in one half must not stop the other half from being
      # delivered.
      - name: Scan and deliver every hour
        env:
          MAX_SERVERS_TO_TEST: "40"
          MAX_TEST_SECONDS: "600"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: |
          # A scan takes ~6.7 min, so 53 min of sleep makes a ~59.7 min
          # cycle. The 305-minute budget allows six scans and ends at
          # ~305 min, leaving ~50 min of slack under the 355-minute
          # timeout for a slow scan or a stuck package install.
          INTERVAL=3180
          BUDGET=$((5 * 3600 + 300))
          DEADLINE=$(( $(date +%s) + BUDGET ))
          CYCLE=0

          while :; do
            CYCLE=$((CYCLE + 1))
            echo "===== scan cycle $CYCLE at $(date -u '+%Y-%m-%d %H:%M UTC') ====="

            # continue-on-error keeps one failing half of the scan from
            # blocking delivery of whatever the other half found.
            python src/vpngate_api.py || echo "OpenVPN scan failed; continuing."
            python src/sstp_fetcher.py || echo "SSTP fetch failed; continuing."

            echo "vpn * vpn *" | sudo tee /etc/ppp/chap-secrets > /dev/null
            echo "vpn * vpn *" | sudo tee /etc/ppp/pap-secrets > /dev/null
            sudo chmod 600 /etc/ppp/chap-secrets /etc/ppp/pap-secrets

            python src/sstp_tester.py || echo "SSTP test failed; continuing."

            echo "========== OUTPUT FILES =========="
            ls -la output/ 2>&1 || true

            for file in output/selected_servers.json output/selected_sstp_servers.json; do
              if [ -f "$file" ]; then
                echo "--- $file ---"
                python -c "import json; print('entries:', len(json.load(open('$file'))))" || true
              fi
            done

            python src/telegram_sender.py || echo "Telegram delivery failed; continuing."
            python src/rubika_sender.py || echo "Rubika delivery failed; continuing."

            now=$(date +%s)
            remaining=$(( DEADLINE - now ))

            if [ "$remaining" -le 0 ]; then
              echo "Time budget spent; ending so the next fire can take over."
              break
            fi

            pause=$INTERVAL
            [ "$remaining" -lt "$pause" ] && pause=$remaining

            echo "Next scan in $((pause / 60)) min."
            sleep "$pause"
          done

      - name: Package OpenVPN files
        if: always()
        run: |
          if [ -d output/openvpn ] && [ "$(find output/openvpn -name '*.ovpn' -type f | wc -l)" -gt 0 ]; then
            (cd output && zip -r ../vpngate-openvpn-configs.zip openvpn)
          else
            echo "No OpenVPN configuration files were generated."
          fi

      - name: Upload OpenVPN package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-openvpn-configs
          path: vpngate-openvpn-configs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload selected OpenVPN servers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-selected-servers
          path: output/selected_servers.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload selected SSTP servers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-selected-sstp-servers
          path: output/selected_sstp_servers.json
          if-no-files-found: warn
          retention-days: 7
